# Workflow definition for the etl_rentals_data Cloud Workflow.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - version: ${map.get(args, "VERSION")}
          - environment: ${map.get(args, "ENVIRONMENT")}
          - city: ${map.get(args, "CITY")}
          - sites: ${map.get(args, "SITES")}
          - property_types: ${map.get(args, "PROPERTY_TYPES")}
          - upload_to_gcs: ${map.get(args, "UPLOAD_TO_GCS")}
          - start_page: ${map.get(args, "START_PAGE")}
          - max_page: ${map.get(args, "MAX_PAGE")}
          - file_date: ${map.get(args, "FILE_DATE")}
          - upload_to_bq: ${map.get(args, "UPLOAD_TO_BQ")}
    - run_scraper_data_to_bucket:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + location + "/jobs/scraper-data-to-bucket" + "-" + version}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENVIRONMENT
                      value: ${environment}
                    - name: CITY
                      value: ${city}
                    - name: SITES
                      value: ${sites}
                    - name: PROPERTY_TYPES
                      value: ${property_types}
                    - name: UPLOAD_TO_GCS
                      value: ${upload_to_gcs}
                    - name: START_PAGE
                      value: ${start_page}
                    - name: MAX_PAGE
                      value: ${max_page}
        result: scraper_operation
    - run_gcs_to_bigquery_bronze:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + location + "/jobs/gcs-to-bigquery-bronze" + "-" + version}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENVIRONMENT
                      value: ${environment}
                    - name: CITY
                      value: ${city}
                    - name: SITES
                      value: ${sites}
                    - name: PROPERTY_TYPES
                      value: ${property_types}
                    - name: FILE_DATE
                      value: ${file_date}
                    - name: UPLOAD_TO_BQ
                      value: ${upload_to_bq}
                    - name: START_PAGE
                      value: ${start_page}
                    - name: MAX_PAGE
                      value: ${max_page}
        result: bronze_operation
    - run_process_silver_layer:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + location + "/jobs/process-silver-layer" + "-" + version}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENVIRONMENT
                      value: ${environment}
                    - name: CITY
                      value: ${city}
                    - name: SITES
                      value: ${sites}
                    - name: PROPERTY_TYPES
                      value: ${property_types}
                    - name: FILE_DATE
                      value: ${file_date}
        result: silver_operation
    - run_model_gold_layer:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + location + "/jobs/model-gold-layer" + "-" + version}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENVIRONMENT
                      value: ${environment}
                    - name: FILE_DATE
                      value: ${file_date}
        result: gold_operation
    - done:
        return: ${gold_operation}
