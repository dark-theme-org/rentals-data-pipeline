# Workflow definition for the etl_rentals_data Cloud Workflow.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - version: ${map.get(args, "VERSION")}
          - environment: ${map.get(args, "ENVIRONMENT")}
          - city: ${map.get(args, "CITY")}
          - sites: ${map.get(args, "SITES")}
          - property_types: ${map.get(args, "PROPERTY_TYPES")}
          - upload_to_gcs: ${map.get(args, "UPLOAD_TO_GCS")}
    - run_scraper_data_to_bucket:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + location + "/jobs/scraper-data-to-bucket" + "-" + version}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: ENVIRONMENT
                      value: ${environment}
                    - name: CITY
                      value: ${city}
                    - name: SITES
                      value: ${sites}
                    - name: PROPERTY_TYPES
                      value: ${property_types}
                    - name: UPLOAD_TO_GCS
                      value: ${upload_to_gcs}
        result: operation
    - done:
        return: ${operation}
