[autoflake]
# DESTRUCTIVE EDITING: Setting 'in-place = true' allows the tool to
# modify your files directly. Without this, it would only output
# the suggested changes to your terminal rather than saving them.
in_place = true

# IMPORT CLEANUP: Automatically deletes 'import' statements that aren't
# actually used in the code. This is great for keeping your
# 'src' directory lean and avoiding unnecessary dependencies.
remove_all_unused_imports = true

# VARIABLE CLEANUP: Removes variables that are defined but never used.
# This is especially helpful in data science when you might create
# a temporary dataframe or counter during debugging and forget to delete it.
remove_unused_variables = true

# INIT MODULE IMPORTS: Without this, 'remove_all_unused_imports' would
# delete re-exports from __init__.py files (e.g. 'from .module import X')
# even though they are intentional public API surface, not unused imports.
ignore_init_module_imports = true
