[mypy]
# PYTHON VERSION: Tells mypy which Python version's syntax and stdlib
# semantics to assume when type-checking. Without this, mypy uses the
# version of the interpreter running it, which can drift from the
# project's actual target as defined in pyproject.toml.
python_version = 3.13

# MYPY PATH: Tells mypy where to find first-party modules in our
# 'src/' layout. Without this, mypy can't resolve imports like
# 'from app.foo import bar' when invoked standalone (outside pre-commit).
mypy_path = src

# DEBUGGING: Adds the specific error code (e.g., [arg-type]) to the output.
# This is vital because it tells you exactly which rule you've violated
# so you can look it up or ignore it specifically.
show_error_codes = True

# TYPE SAFETY: Flags a warning if a function is defined to return a specific type
# but actually returns 'Any'. This prevents "type leakage" where your
# strict rules are accidentally bypassed.
warn_return_any = True

# HYGIENE: Warns you if there are settings in this config file that
# aren't actually being used. It keeps your configuration lean.
warn_unused_configs = True

# ENFORCEMENT: This is the "Strict Mode" toggle. It requires every single function
# to have type hints (e.g., def func(x: int) -> str:).
# This is the best way to ensure long-term maintainability in data pipelines.
disallow_untyped_defs = True

# ENFORCEMENT: Prevents you from calling a function that doesn't have
# type hints from a function that does. It keeps the "safety chain" unbroken.
disallow_untyped_calls = True

# ENFORCEMENT: Even if a function doesn't have type hints, mypy will still
# look inside and try to catch obvious errors.
check_untyped_defs = True

# EXTERNAL LIBS: Many data science libraries (like pandas or older utilities)
# don't have type hints built-in. This prevents mypy from crashing when
# it can't find type definitions for your third-party imports.
ignore_missing_imports = True
