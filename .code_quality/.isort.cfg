[settings]
# PROFILE: This is the "peace treaty" between isort and Black.
# Black has very specific rules about how imports should be wrapped and
# comma-spaced. Without this setting, isort will try to format imports
# one way, and Black will immediately change them back, creating an
# infinite loop of file changes.
profile = black

# LINE LENGTH: Match Black's configured line length so isort and Black
# don't fight when wrapping long imports. The 'profile = black' default
# is 88, but our Black config uses 100 to stay consistent with SQLFluff
# and Flake8.
line_length = 100

# SOURCE PATHS: Tells isort which directories contain first-party code.
# This ensures imports from 'src' and 'tests' are correctly grouped as
# "local" rather than misclassified as third-party in the import block.
src_paths = src,tests

# KNOWN FIRST-PARTY: explicit list of top-level packages that live in this
# repo. `src_paths` alone isn't always enough when isort runs from a config
# file outside the repo root (here, `.code_quality/.isort.cfg`) — declaring
# `app` here keeps it grouped with FIRSTPARTY (after THIRDPARTY) and matches
# pylint's wrong-import-order expectation.
known_first_party = app
