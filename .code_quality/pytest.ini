[pytest]
# VERSION CONTROL: Ensures the developer is using a modern version of Pytest.
minversion = 7.0

# MODULE RESOLUTION: This is the "magic" line for your src-layout.
pythonpath = src

# DISCOVERY: Tells Pytest exactly where your test files are located.
testpaths = tests

# STRICT MODE: '--strict-markers' fails the test run if a test references
# a pytest marker that hasn't been declared, catching typos like
# '@pytest.mark.slwo'. '--strict-config' fails if this ini file contains
# unknown options, preventing silent misconfiguration.
addopts = --strict-markers --strict-config

# ENVIRONMENT VARIABLES: Sets default variables for the test session.
env =
    USER=local
    ENVIRONMENT=dev
    CITY=macae
    SITES=vivareal,zapimoveis
    PROPERTY_TYPES=apartment,house
    UPLOAD_TO_GCS=true
    UPLOAD_TO_BQ=true
    START_PAGE=1
    MAX_PAGE=-1