# Registry of all executable tasks in the project.
# Each task defines the runtime configuration for a Cloud Run Job.

scraper_data_to_bucket:
  description: Scrape properties from sites and upload raw data to GCS.
  type: python
  machine:
    cpu: "1"
    memory: 512Mi
    timeout: 600s
  entrypoint: app.entrypoints.scraper_data_to_bucket
  inputs:
    parameters:
      - name: environment
        type: str
        default: dev
      - name: city
        type: str
        default: macae
      - name: sites
        type: str
        default: vivareal,zapimoveis
      - name: property_types
        type: str
        default: apartment,house
